<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدايرة</title><style>body{background:#0f0f0f;color:#fff;font-family:system-ui;margin:0;display:flex;flex-direction:column;height:100vh}#chat{flex:1;overflow-y:auto;padding:10px}.msg{background:#1e1e1e;padding:8px 12px;border-radius:12px;margin:6px 0;max-width:85%;position:relative}.msg.me{background:#2d5cff;margin-left:auto}.msg.user{font-size:12px;color:#aaa}.msg.time{font-size:10px;color:#888;float:left}.msg img{max-width:200px;border-radius:10px;display:block;margin-top:5px}.msg audio{width:200px;margin-top:5px}.reacts{margin-top:4px}.react-btn{cursor:pointer;margin:2px}#inputBar{display:flex;padding:10px;background:#1a1a1a;gap:5px;align-items:center}#inputBar input[type=text]{flex:1;padding:10px;border-radius:20px;border:none;background:#2a2a2a;color:#fff}#inputBar button{width:40px;height:40px;border-radius:50%;border:none;background:#2d5cff;color:#fff;font-size:16px}</style></head><body><div id="loginBox" style="padding:20px;text-align:center"><h2>خش للدايرة</h2><input id="username" placeholder="اسمك" style="padding:10px;border-radius:20px;border:none;width:80%"><br><button onclick="login()" style="padding:10px 20px;border-radius:20px;background:#2d5cff;color:#fff;border:none;margin-top:10px">دخول</button></div><div id="chatBox" style="display:none;flex-direction:column;height:100vh"><div id="chat"></div><div id="inputBar"><input type="file" id="fileInput" accept="image/*,audio/*" style="display:none"><button onclick="document.getElementById('fileInput').click()">📷</button><button id="recordBtn">🎤</button><input type="text" id="msgInput" placeholder="اكتب..."><button onclick="sendMsg()">➤</button></div></div><script>let myName="",isAdmin=false;async function login(){myName=document.getElementById('username').value.trim();if(!myName)return alert('اكتب اسمك');let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:myName})});let j=await r.json();if(j.ok){isAdmin=j.is_admin;document.getElementById('loginBox').style.display='none';document.getElementById('chatBox').style.display='flex';setInterval(loadMsgs,1500);loadMsgs();}}async function loadMsgs(){let r=await fetch('/api/messages');let msgs=await r.json();let chat=document.getElementById('chat');chat.innerHTML='';msgs.forEach(m=>{let div=document.createElement('div');div.className='msg'+(m.user==myName?' me':'');let content=m.type=='image'?`<img src="${m.text}">`:m.type=='audio'?`<audio controls src="${m.text}"></audio>`:m.text;let reacts=Object.entries(m.reactions||{}).map(([e,users])=>`<span class="react-btn" onclick="react(${m.id},'${e}')">${e} ${users.length}</span>`).join(' ');div.innerHTML=`<div class="user">${m.user} ${m.is_admin?'👑':''} <span class="time">${m.time}</span></div><div>${content}</div><div class="reacts">${reacts} <span class="react-btn" onclick="react(${m.id},'❤️')">❤️</span><span class="react-btn" onclick="react(${m.id},'😂')">😂</span><span class="react-btn" onclick="react(${m.id},'👍')">👍</span></div>${(m.user==myName||isAdmin)?`<div style="position:absolute;top:2px;left:5px"><span onclick="delMsg(${m.id})" style="cursor:pointer">🗑️</span>${isAdmin&&m.user!=myName?`<span onclick="kick('${m.user}')">🚫</span>`:''}</div>`:''}`;chat.appendChild(div);});chat.scrollTop=chat.scrollHeight;}async function sendMsg(){let text=document.getElementById('msgInput').value.trim();if(!text)return;await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});document.getElementById('msgInput').value='';loadMsgs();}document.getElementById('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});document.getElementById('fileInput').onchange=async e=>{let file=e.target.files[0];if(!file)return;let fd=new FormData();fd.append('file',file);let r=await fetch('/api/upload',{method:'POST',body:fd});let j=await r.json();if(!j.ok)alert(j.error);else loadMsgs();};let mediaRecorder,chunks=[];document.getElementById('recordBtn').onclick=async ()=>{if(mediaRecorder&&mediaRecorder.state=='recording'){mediaRecorder.stop();document.getElementById('recordBtn').innerText='🎤';return;}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(stream);chunks=[];mediaRecorder.ondataavailable=e=>chunks.push(e.data);mediaRecorder.onstop=async()=>{let blob=new Blob(chunks,{type:'audio/webm'});let fd=new FormData();fd.append('file',new File([blob],"voice.webm"));let r=await fetch('/api/upload',{method:'POST',body:fd});let j=await r.json();if(j.ok)loadMsgs();};mediaRecorder.start();document.getElementById('recordBtn').innerText='⏹️';}catch{alert('الميك يبي https')}};async function delMsg(id){if(!confirm('تمسح؟'))return;await fetch('/api/delete/'+id,{method:'DELETE'});loadMsgs();}async function kick(user){if(!confirm('تطرد '+user+'؟'))return;await fetch('/api/kick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user})});loadMsgs();}async function react(id,emoji){await fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({msg_id:id,emoji})});loadMsgs();}</script></body></html>
